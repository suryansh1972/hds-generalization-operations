[project]
name = "semgen"
version = "0.1.0"
description = "Deterministic symbolic generalization of small clinical graph motifs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6",
    "polars>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semgen"]

[tool.pytest.ini_options]
markers = ["snomed: needs local RF2"]
testpaths = ["tests"]
